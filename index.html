<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windown</title>

<style>
:root {
  --void: #000000;
  --border: #969696;
  --wet: #f0f0f0;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  background: var(--void);
}

body {
  display: grid;
  place-items: center;
  overflow: hidden;
  font-family: "Courier New", monospace;
}

#sky {
  position: fixed;
  inset: 0;
  z-index: 0;
  display: block;
}

.get {
  position: relative;
  z-index: 1;
  display: inline-block;
  color: var(--wet);
  text-decoration: none;
  border: 1px solid var(--border);
  padding: 12px 24px;
  background: var(--void);
  transition: color .12s, border-color .12s;
}

.get:hover,
.get:focus-visible {
  color: #fff;
  border-color: var(--wet);
  outline: none;
}
</style>
</head>

<body>

<canvas id="sky"></canvas>

<a class="get" href="windown.exe" download>
  Download for Windows
</a>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return;

  var canvas = document.getElementById("sky");
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  var W, H;
  var stars = [];

  function tint() {
    var u = Math.random();
    if (u < 0.45) return [1,1,1];
    if (u < 0.68) return [1,0.85,0.45];
    if (u < 0.85) return [0.55,0.75,1];
    if (u < 0.95) return [1,0.60,0.25];
    return [1,0.35,0.30];
  }

  function makeStars() {
    var n = Math.round((window.innerWidth * window.innerHeight) / 5200);
    n = Math.max(120, Math.min(520, n));

    stars = [];

    for (var i = 0; i < n; i++) {
      var base = Math.random();
      base *= base;
      base = 0.12 + base * 0.88;

      var t = tint();

      stars.push({
        fx: Math.random(),
        fy: Math.random(),
        base: base,
        amp: base * base * (0.5 + Math.random() * 0.5),
        speed: 4 + Math.random() * 6,
        cur: base,
        ox: 0,
        oy: 0,
        seed: (Math.random() * 4294967295) >>> 0 | 1,
        cr: 1 + (t[0]-1) * base,
        cg: 1 + (t[1]-1) * base,
        cb: 1 + (t[2]-1) * base,
        big: base > 0.5
      });
    }
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);

    makeStars();
  }

  function rnd(s) {
    s = (Math.imul(s,1664525) + 1013904223) >>> 0;
    return [((s>>>8)&0xffff)/65535 - 0.5, s];
  }

  function frame() {
    ctx.clearRect(0,0,W,H);

    for (var i = 0; i < stars.length; i++) {

      var sp = stars[i];

      var x = sp.fx * W + sp.ox;
      var y = sp.fy * H + sp.oy;

      var r1 = rnd(sp.seed);
      var bstep = r1[0] * sp.speed * 0.022;
      sp.seed = r1[1];

      sp.cur += bstep;
      sp.cur += (sp.base - sp.cur) * 0.14;

      var amp = sp.amp * 0.28;
      var lo = sp.base - amp;
      var hi = sp.base + amp;

      if (sp.cur < lo) sp.cur = lo;
      if (sp.cur > hi) sp.cur = hi;

      var r2 = rnd(sp.seed);
      sp.seed = r2[1];

      var r3 = rnd(sp.seed);
      sp.seed = r3[1];

      sp.ox += bstep * 3 + r2[0] * 0.08;
      sp.oy += r3[0] * 0.12 - bstep * 1.5;

      sp.ox += -sp.ox * 0.18;
      sp.oy += -sp.oy * 0.18;

      if (sp.ox > 0.6) sp.ox = 0.6;
      if (sp.ox < -0.6) sp.ox = -0.6;
      if (sp.oy > 0.6) sp.oy = 0.6;
      if (sp.oy < -0.6) sp.oy = -0.6;

      var level = sp.cur < 0 ? 0 : sp.cur;
      var b = level * 130;

      if (b > 175) b = 175;
      if (b < 2) continue;

      var size = sp.big ? 2 : 1;

      var dev = Math.abs(sp.cur - sp.base);
      var shift = dev * 9;

      if (sp.base > 0.4 && shift > 0.6) {
        var so = shift > 1.4 ? 2 : 1;

        ctx.fillStyle = "rgb(" + Math.round(b * sp.cr) + ",0,0)";
        ctx.fillRect(Math.round(x - so), Math.round(y - so), size, size);

        ctx.fillStyle = "rgb(0,0," + Math.round(b * sp.cb) + ")";
        ctx.fillRect(Math.round(x + so), Math.round(y + so), size, size);
      }

      ctx.fillStyle =
        "rgb(" +
        Math.round(b * sp.cr) + "," +
        Math.round(b * sp.cg) + "," +
        Math.round(b * sp.cb) + ")";

      ctx.fillRect(Math.round(x), Math.round(y), size, size);
    }

    requestAnimationFrame(frame);
  }

  var timer;

  window.addEventListener("resize", function () {
    clearTimeout(timer);
    timer = setTimeout(resize, 150);
  });

  resize();
  requestAnimationFrame(frame);

})();
</script>

</body>
</html>
